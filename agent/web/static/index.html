<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />
    <meta name="theme-color" content="#ffffff" />
    <title>Pulse | Evidence-backed weekly review</title>
    <link rel="icon" href="/static/favicon.svg" type="image/svg+xml" />
    <link rel="stylesheet" href="/static/workspace.css" />
    <link
      rel="preload"
      href="/static/fonts/dm-sans-latin.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />
  </head>
  <body>
    <a class="skip-link" href="#main">Skip to review</a>
    <div class="wrap">
      <nav class="workspace-nav" aria-label="Pulse workspace">
        <a class="brand" href="/">Pulse<span>Weekly review</span></a>
        <div class="nav-links">
          <button data-v="review" class="on">Review queue</button
          ><button data-v="briefing">Weekly briefing</button
          ><button data-v="items">Commitments</button
          ><button data-v="workstreams">Workstreams</button
          ><button data-v="ask" data-local>Ask Pulse</button>
          <details class="nav-system" data-local>
            <summary>System</summary>
            <div class="system-menu">
              <button data-v="connectors">Connectors</button
              ><button data-v="sync">Sync history</button
              ><button data-v="settings">Settings &amp; data</button>
            </div>
          </details>
        </div>
        <a
          class="local-link"
          href="https://github.com/MohammedAlkindi/Pulse#setup-with-your-own-accounts"
          >Run Pulse locally ↗</a
        >
      </nav>
      <main class="workspace-main" id="main" tabindex="-1">
        <p role="status">Loading review…</p>
      </main>
    </div>
    <dialog id="drawer" aria-labelledby="drawer-title">
      <button class="close" id="drawerClose" aria-label="Close evidence">
        ×
      </button>
      <div id="drawerBody"></div>
    </dialog>
    <script src="/static/briefing.js"></script>
    <script src="/static/review.js"></script>
    <script src="/static/app.js"></script>
  </body>
</html>
